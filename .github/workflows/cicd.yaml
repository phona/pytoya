name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_OWNER: ${{ vars.GHCR_OWNER || github.repository_owner }}
  CHART_ID: ${{ vars.CHART_ID || 'pytoya' }}
  API_IMAGE: pytoya/api
  WEB_IMAGE: pytoya/web

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run type-check

  test_api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Test (API)
        run: npm run test --workspace=@pytoya/api

  test_web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Test + Coverage Gates (Web)
        run: npm run test:coverage --workspace=@pytoya/web

  ci:
    runs-on: ubuntu-latest
    needs: [quality, test_api, test_web]
    steps:
      - name: CI summary
        run: echo "quality + test_api + test_web passed"

  deploy:
    runs-on: [self-hosted, linux]
    needs: [ci]
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == 'master') }}
    environment: production
    permissions:
      contents: read
    steps:
      - name: Build and deploy
        shell: bash
        run: |
          set -euo pipefail
          cd /home/github-runner/pytoya-build
          git pull origin master
          docker compose build api web
          docker tag pytoya-build-api:latest ghcr.io/phona/pytoya/api:latest
          docker tag pytoya-build-web:latest ghcr.io/phona/pytoya/web:latest
          cd /home/github-runner/pytoya
          docker compose down
          docker compose up -d

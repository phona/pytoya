name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_OWNER: ${{ vars.GHCR_OWNER || github.repository_owner }}
  SSH_HOST: 47.107.92.78
  SSH_USER: github-runner

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check

  test_api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test --workspace=@pytoya/api

  test_web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:coverage --workspace=@pytoya/web

  ci:
    runs-on: ubuntu-latest
    needs: [quality, test_api, test_web]
    steps:
      - run: echo "quality + test_api + test_web passed"

  build_images:
    runs-on: ubuntu-latest
    needs: ci
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == 'master') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            display: API
            dockerfile: src/apps/api/Dockerfile
            build_args: ""
          - name: web
            display: Web
            dockerfile: src/apps/web/Dockerfile
            build_args: VITE_API_URL=/api
    name: Build image (${{ matrix.display }})
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/pytoya/${{ matrix.name }}:latest
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/pytoya/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [build_images]
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == 'master') }}
    environment: production
    steps:
      - name: Deploy via SSH
        shell: bash
        env:
          SSH_HOST: ${{ env.SSH_HOST }}
          SSH_USER: ${{ env.SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh "$SSH_USER@$SSH_HOST" docker login ghcr.io -u "${{ github.actor }}" --password-stdin <<< "${{ secrets.GHCR_TOKEN }}"
          ssh "$SSH_USER@$SSH_HOST" docker compose -f /home/github-runner/pytoya/docker-compose.yml pull
          ssh "$SSH_USER@$SSH_HOST" docker compose -f /home/github-runner/pytoya/docker-compose.yml down
          ssh "$SSH_USER@$SSH_HOST" docker compose -f /home/github-runner/pytoya/docker-compose.yml up -d

<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>格子校对</title>
<style>
body { font-family: 'Segoe UI', sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; background: #f5f5f5; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.card { background: #fff; border-radius: 8px; padding: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.card img { max-width: 100%; border: 1px solid #ddd; border-radius: 4px; }
.info { font-size: 13px; color: #666; margin: 6px 0; }
.label { font-weight: bold; }
.correct { color: #4caf50; }
.wrong { color: #f44336; }
input { width: 100%; padding: 6px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
.actions { margin-top: 8px; display: flex; gap: 8px; }
.btn-save { background: #4caf50; color: #fff; border: none; padding: 6px 16px; border-radius: 4px; cursor: pointer; }
.btn-next { background: #2196f3; color: #fff; border: none; padding: 6px 16px; border-radius: 4px; cursor: pointer; }
.stats { margin: 16px 0; padding: 12px; background: #fff; border-radius: 8px; }
.footer { margin-top: 20px; text-align: center; }
.export-btn { background: #ff9800; color: #fff; border: none; padding: 10px 24px; border-radius: 4px; cursor: pointer; font-size: 16px; }
</style>
</head>
<body>
<h2>📋 格子校对工具</h2>
<div class="stats" id="stats">加载中...</div>
<button class="export-btn" onclick="exportData()">📥 导出校对结果 JSON</button>
<div class="grid" id="grid"></div>
<div class="footer"><button class="export-btn" onclick="exportData()">📥 导出校对结果 JSON</button></div>

<script>
const CELLS_DIR = 'qwen_sample';  // 格子图片目录
let corrections = {};

async function loadData() {
    // 通过 index.json 加载格子列表
    const resp = await fetch('index.json');
    const files = await resp.json();
    
    const stats = document.getElementById('stats');
    stats.innerHTML = `共 ${files.length} 个格子`;
    
    const grid = document.getElementById('grid');
    for (const f of files) {
        const card = document.createElement('div');
        card.className = 'card';
        card.id = 'card-' + f.name;
        
        // 文件名解析
        const name = f.name.replace('.png', '');
        const parts = name.split('_');
        const label = parts[parts.length - 1].replace(/p/g, '.');
        const row = parts.find(p => p.startsWith('r'));
        const field = f.field || parts.find(p => ['品名','数量','单价','总额','行号'].includes(p)) || '?';
        const mid = parts.find(p => p.startsWith('m'));
        
        card.innerHTML = `
            <div class="info">${mid || ''} ${row ? row : ''} ${field} | 原始标签: <span class="label" id="label-${f.name}">${label}</span></div>
            <img src="${CELLS_DIR}/${f.name}" onerror="this.style.display='none'" loading="lazy">
            <input type="text" id="input-${f.name}" value="${label}" placeholder="输入正确的值...">
            <div class="actions">
                <button class="btn-save" onclick="save('${f.name}')">✅ 确认</button>
                <button class="btn-next" onclick="save('${f.name}'); next('${f.name}')">⬇ 确认并下一个</button>
            </div>
            <div id="status-${f.name}" style="font-size:12px;margin-top:4px"></div>
        `;
        grid.appendChild(card);
    }
}

function save(name) {
    const input = document.getElementById('input-' + name);
    const val = input.value.trim();
    const label = document.getElementById('label-' + name);
    const status = document.getElementById('status-' + name);
    
    corrections[name] = val;
    label.textContent = val;
    label.className = 'label correct';
    status.textContent = '✅ 已确认: ' + val;
    status.style.color = '#4caf50';
    updateStats();
}

function next(name) {
    const cards = document.querySelectorAll('.card');
    let found = false;
    for (const card of cards) {
        if (found) {
            card.scrollIntoView({ behavior: 'smooth', block: 'start' });
            const input = card.querySelector('input');
            if (input) input.focus();
            return;
        }
        if (card.id === 'card-' + name) found = true;
    }
}

function updateStats() {
    const total = Object.keys(corrections).length;
    document.getElementById('stats').innerHTML = `已确认 ${total} 个格子`;
}

function exportData() {
    const blob = new Blob([JSON.stringify(corrections, null, 2)], {type: 'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'corrections.json';
    a.click();
}

loadData();
</script>
</body>
</html>
